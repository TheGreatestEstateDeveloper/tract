<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tract</title>
<meta name="description" content="Virginia parcels, owners, values, zoning, rezoning cases and builder intelligence.">
<meta name="theme-color" content="#14281F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tract">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <div id="map" class="map" role="application" aria-label="Map of Virginia parcels"></div>

  <header class="topbar">
    <form id="search-form" class="search" role="search" autocomplete="off">
      <span class="search-mark" aria-hidden="true"></span>
      <input id="search" type="search" placeholder="Address, place, or owner: NAME" aria-label="Search an address, place, coordinates, or owner name" enterkeyhint="search">
      <button type="submit" class="search-go" aria-label="Search">Go</button>
    </form>
    <div class="map-tools">
      <button type="button" id="btn-locate" class="tool" aria-label="Go to my location" title="My location">◎</button>
      <button type="button" id="btn-basemap" class="tool" aria-label="Switch to satellite" title="Satellite / streets">⧉</button>
    </div>
    <div id="search-results" class="search-results" hidden></div>
  </header>

  <aside id="panel" class="panel" data-state="half" aria-label="Details">
    <button type="button" id="panel-handle" class="panel-handle" aria-label="Resize panel"><span></span></button>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" data-tab="parcel" aria-selected="true">Parcel</button>
      <button type="button" role="tab" class="tab" data-tab="sites">Sites</button>
      <button type="button" role="tab" class="tab" data-tab="firms">Firms</button>
      <button type="button" role="tab" class="tab" data-tab="saved">Saved</button>
      <button type="button" role="tab" class="tab" data-tab="more">More</button>
    </nav>
    <div class="panel-body">
      <section id="tab-parcel" class="tabpane" role="tabpanel"></section>
      <section id="tab-sites" class="tabpane" role="tabpanel" hidden></section>
      <section id="tab-firms" class="tabpane" role="tabpanel" hidden></section>
      <section id="tab-saved" class="tabpane" role="tabpanel" hidden></section>
      <section id="tab-more" class="tabpane" role="tabpanel" hidden></section>
    </div>
  </aside>

  <div id="layer-bar" class="layer-bar" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
<script src="js/localities.js"></script>
<script src="js/firms.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
